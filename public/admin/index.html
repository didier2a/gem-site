<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin GEM — Casa di l’Isula</title>
    <!-- defer : Decap 3 attache son nœud à document.body. Sans defer, le script du head s’exécute avant <body> et plante (appendChild sur null). -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js" defer></script>
  </head>
  <body>
    <script>
      (function () {
        var MARKER = "GEMMEDIA1";
        var urls = new WeakMap();
        function pointerUrl(bytes) {
          if (!bytes || bytes.length < MARKER.length + 1 || bytes.length > 2048) return "";
          for (var i = 0; i < MARKER.length; i++) {
            if (bytes[i] !== MARKER.charCodeAt(i)) return "";
          }
          var url = "";
          try {
            url = new TextDecoder().decode(bytes.subarray(MARKER.length));
          } catch (e) {
            return "";
          }
          if (url.indexOf("/uploads/blog/") !== 0 && url.indexOf("/uploads/pages/") !== 0) return "";
          if (url.indexOf("..") !== -1 || url.indexOf("\\") !== -1 || url.indexOf("//") !== -1) return "";
          return url;
        }
        var OrigBlob = Blob;
        function GemBlob(parts, options) {
          var blob = new OrigBlob(parts, options);
          var part = parts && parts[0];
          if (part instanceof Uint8Array) {
            var url = pointerUrl(part);
            if (url) urls.set(blob, url);
          }
          return blob;
        }
        GemBlob.prototype = OrigBlob.prototype;
        window.Blob = GemBlob;
        var OrigFile = File;
        function GemFile(parts, name, options) {
          var file = new OrigFile(parts, name, options);
          var part = parts && parts[0];
          if (part && urls.has(part)) urls.set(file, urls.get(part));
          return file;
        }
        GemFile.prototype = OrigFile.prototype;
        window.File = GemFile;
        var origCreate = URL.createObjectURL.bind(URL);
        URL.createObjectURL = function (obj) {
          if (obj && urls.has(obj)) return urls.get(obj);
          return origCreate(obj);
        };
      })();
      (function () {
        var MAX = 6000000;
        var MSG = "Cette image dépasse 6 Mo. Réduisez-la avant de l’envoyer.";
        function oversized(list) {
          if (!list || !list.length) return false;
          for (var i = 0; i < list.length; i++) {
            if (list[i] && list[i].size > MAX) return true;
          }
          return false;
        }
        document.addEventListener("change", function (event) {
          var input = event.target;
          if (!input || input.type !== "file" || !oversized(input.files)) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          input.value = "";
          window.alert(MSG);
        }, true);
        document.addEventListener("drop", function (event) {
          var files = event.dataTransfer && event.dataTransfer.files;
          if (!oversized(files)) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          window.alert(MSG);
        }, true);
      })();
    </script>
  </body>
</html>
