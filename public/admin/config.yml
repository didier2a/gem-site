# Decap CMS — GEM Casa di l’Isula
#
# Preview (hors localhost) : backend proxy. Le Worker /api/decap-proxy
# enregistre sur GitHub avec le secret GITHUB_CONTENT_PAT. Le navigateur
# ne voit jamais ce jeton, et l’animatrice n’a pas de compte GitHub.
# La porte mot de passe (/admin/) est devant cette config : sans cookie
# de session, le Worker ne sert pas ce fichier.
# Session animatrice (ADMIN_USERS) et session GitHub (ADMIN_GITHUB_LOGINS)
# reçoivent cette config en entier : blog et pages. Le proxy PAT autorise
# les mêmes chemins (content/blog, content/pages, public/uploads/blog,
# public/uploads/pages).
# Le rôle distingue l’entrée de connexion, pas un plafond de droits Decap.
#
# Local : local_backend bascule vers decap-server (port 8081) dès qu’il
# répond. Lancer `npm run cms` en même temps que `npm run dev`.
#
# Publication : commit direct sur main (droits Contents du jeton).
# Le mode pull request n’est pas activé : un jeton « Contents » seul
# ne peut pas ouvrir de PR. Les routes /api/oauth restent disponibles
# si l’on revient un jour à un backend GitHub nominatif.
local_backend: true

backend:
  name: proxy
  proxy_url: /api/decap-proxy
  branch: main

site_url: https://gem-casa-preview.infoserv2a.workers.dev
logo_url: /assets/logo/logo-casa-gem.png

# Images : 6 Mo maximum (poids du fichier). Le Worker mesure le base64
# sans décoder l’image. Le slash initial est obligatoire : sans lui,
# Decap colle le dossier au fichier (« content/pages/public/uploads/… »).
media_folder: /public/uploads/blog
public_folder: /uploads/blog

locale: fr

# Collection « medias_info » (files: []) omise : une collection vide
# n’apporte rien et peut empêcher Decap de démarrer. Les images
# passent par media_folder.

collections:
  - name: blog
    label: Articles du blog
    label_singular: Article
    folder: content/blog
    media_folder: /public/uploads/blog
    public_folder: /uploads/blog
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Titre, name: title, widget: string }
      - label: Date
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        picker_utc: true
      - { label: Catégorie, name: category, widget: string, required: false }
      - { label: Extrait, name: excerpt, widget: text }
      - { label: Image de couverture, name: cover, widget: image, required: false }
      - { label: Corps, name: body, widget: markdown }
      # Phase 1 : draft true = absent des listes publiques (src/pages/blog).
      - label: Brouillon
        name: draft
        widget: boolean
        default: false
        hint: "Coché : l’article n’est pas listé sur le site. Décoché : publié."

  - name: pages
    label: Pages du site
    label_singular: Page
    media_folder: /public/uploads/pages
    public_folder: /uploads/pages
    files:
      - name: qui-sommes-nous
        label: Qui sommes-nous ?
        file: content/pages/qui-sommes-nous.md
        fields:
          - { label: Titre, name: title, widget: string }
          - { label: Introduction, name: intro, widget: markdown }
          - label: Équipe
            name: team
            widget: list
            label_singular: Membre
            summary: "{{fields.name}} — {{fields.role}}"
            hint: "Ces portraits sont aussi affichés sur l’accueil. Laissez la photo vide pour réafficher le portrait d’origine."
            fields:
              - { label: Nom, name: name, widget: string }
              - { label: Rôle, name: role, widget: string }
              - label: Photo
                name: photo
                widget: image
                required: false
              - { label: "Texte alternatif de la photo", name: photo_alt, widget: string, required: false }
              - { label: Groupe, name: group, widget: string, hint: "Exemple : Le Bureau, Animatrices" }
              - { label: Texte, name: text, widget: text }
          - { label: Corps / blocs texte, name: body, widget: markdown }
      - name: nos-activites
        label: Nos activités
        file: content/pages/nos-activites.md
        fields:
          - { label: Titre, name: title, widget: string }
          - { label: Introduction, name: intro, widget: markdown }
          - label: Activités
            name: activities
            widget: list
            label_singular: Activité
            summary: "{{fields.title}}"
            hint: "L’image et son texte alternatif sont aussi utilisés sur l’accueil lorsque le titre est le même (Peindre, Cuisiner, Marcher)."
            fields:
              - { label: Titre, name: title, widget: string }
              - { label: Texte, name: text, widget: text }
              - label: Image
                name: image
                widget: image
                required: false
                hint: "Laissez vide pour réafficher la photo d’origine."
              - { label: "Texte alternatif", name: image_alt, widget: string, required: false }
          - { label: Corps, name: body, widget: markdown }
      - name: nous-soutenir
        label: Nous soutenir
        file: content/pages/nous-soutenir.md
        fields:
          - { label: Titre, name: title, widget: string }
          - label: "Cartes de soutien"
            name: support_cards
            widget: list
            label_singular: Carte
            summary: "{{fields.title}}"
            hint: "Ordre : don, bénévole, partenaires. L’icône est aussi affichée sur l’accueil, dans le même ordre."
            fields:
              - label: Icône
                name: icon
                widget: image
                required: false
                hint: "Laissez vide pour réafficher l’icône d’origine."
              - { label: "Texte alternatif de l’icône", name: icon_alt, widget: string, required: false }
              - { label: Titre, name: title, widget: string }
          - { label: Corps, name: body, widget: markdown }
          - { label: URL HelloAsso, name: helloasso_url, widget: string, required: false }
      - name: accueil
        label: Accueil
        file: content/pages/accueil.md
        fields:
          - { label: "Titre de l’onglet du navigateur", name: title, widget: string }
          - { label: "Description (référencement)", name: description, widget: text }
          - label: "Image de la bannière"
            name: hero_image
            widget: image
            required: false
            hint: "Photo derrière le grand titre. La vidéo ne se change pas ici. Laissez vide pour réafficher la photo d’origine."
          - { label: "Texte alternatif de la bannière", name: hero_image_alt, widget: string, required: false }
          - label: Bandeau
            name: hero
            widget: object
            fields:
              - { label: "Sur-titre", name: eyebrow, widget: string }
              - { label: "Titre, première ligne", name: title_line1, widget: string }
              - { label: "Titre, deuxième ligne", name: title_line2, widget: string }
              - { label: "Mot en italique", name: title_em, widget: string }
              - { label: "Phrase manuscrite", name: script, widget: string }
              - { label: Citation, name: lead, widget: text }
              - { label: "Bouton principal", name: primary_label, widget: string }
              - { label: "Lien du bouton principal", name: primary_href, widget: string }
              - { label: "Second bouton", name: secondary_label, widget: string }
              - { label: "Lien du second bouton", name: secondary_href, widget: string }
          - label: "Illustration d’accueil"
            name: welcome_image
            widget: image
            required: false
            hint: "Image à côté de « Maison de l’île ». Laissez vide pour réafficher l’illustration d’origine."
          - { label: "Texte alternatif de l’illustration", name: welcome_image_alt, widget: string, required: false }
          - label: "Là où tout commence"
            name: welcome
            widget: object
            fields:
              - { label: "Sur-titre", name: kicker, widget: string }
              - { label: Titre, name: title, widget: string }
              - { label: Texte, name: text, widget: markdown }
          - label: "Image de la vidéo À l’abri des solitudes"
            name: abri_image
            widget: image
            required: false
            hint: "Image de la vidéo. La vidéo elle-même ne se change pas ici. Laissez vide pour réafficher l’image d’origine."
          - { label: "Texte alternatif de cette image", name: abri_image_alt, widget: string, required: false }
          - label: "À l’abri des solitudes"
            name: abri
            widget: object
            fields:
              - { label: "Sur-titre", name: kicker, widget: string }
              - { label: Titre, name: title, widget: string }
              - { label: Texte, name: text, widget: markdown }
          - label: "Aperçu des activités"
            name: activities
            widget: object
            fields:
              - { label: "Sur-titre", name: kicker, widget: string }
              - { label: Titre, name: title, widget: string }
              - { label: Texte, name: text, widget: markdown }
              - { label: "Texte du lien", name: link_label, widget: string }
              - { label: "Lien", name: link_href, widget: string }
              - label: Cartes
                name: cards
                widget: list
                label_singular: Carte
                summary: "{{fields.title}}"
                hint: "Les photos viennent de la page Nos activités (même titre)."
                fields:
                  - { label: Titre, name: title, widget: string }
                  - { label: Texte, name: text, widget: text }
                  - { label: "Texte du lien", name: link_label, widget: string, required: false }
                  - { label: Lien, name: link_href, widget: string, required: false }
          - label: Équipe
            name: team
            widget: object
            hint: "Les portraits viennent de la page Qui sommes-nous."
            fields:
              - { label: "Sur-titre", name: kicker, widget: string }
              - { label: Titre, name: title, widget: string }
              - { label: Introduction, name: lead, widget: text }
              - { label: "Texte du bouton", name: button_label, widget: string }
              - { label: "Lien du bouton", name: button_href, widget: string }
          - label: "Aperçu du blog"
            name: blog_teaser
            widget: object
            hint: "Trois cartes fixes de l’accueil. Elles ne suivent pas toutes seules les derniers articles."
            fields:
              - { label: "Sur-titre", name: kicker, widget: string }
              - { label: Titre, name: title, widget: string }
              - { label: "Texte du lien", name: link_label, widget: string }
              - { label: Lien, name: link_href, widget: string }
              - label: Cartes
                name: cards
                widget: list
                label_singular: Carte
                summary: "{{fields.title}}"
                fields:
                  - { label: Image, name: image, widget: image, required: false }
                  - { label: "Texte alternatif", name: alt, widget: string, required: false }
                  - { label: "Date technique", name: date, widget: string, hint: "Format AAAA-MM-JJ, par exemple 2026-04-24." }
                  - { label: "Date affichée", name: date_label, widget: string }
                  - { label: Titre, name: title, widget: string }
                  - { label: Texte, name: text, widget: text }
                  - { label: "Texte du lien", name: link_label, widget: string }
                  - { label: Lien, name: link_href, widget: string }
          - label: "Nous soutenir"
            name: support
            widget: object
            fields:
              - { label: "Sur-titre", name: kicker, widget: string }
              - { label: Titre, name: title, widget: string }
              - label: Cartes
                name: cards
                widget: list
                label_singular: Carte
                summary: "{{fields.title}}"
                hint: "Les icônes viennent de la page Nous soutenir, dans le même ordre."
                fields:
                  - { label: Titre, name: title, widget: string }
                  - { label: Texte, name: text, widget: text }
                  - { label: "Texte du bouton", name: button_label, widget: string, required: false }
                  - { label: "Lien du bouton", name: button_href, widget: string, required: false }
                  - label: "Style du bouton"
                    name: button_style
                    widget: select
                    options:
                      - { label: Plein, value: primary }
                      - { label: Contour, value: outline }
                      - { label: Discret, value: ghost }
                      - { label: Soleil, value: sun }
                    default: primary
                  - label: "Bouton de don HelloAsso"
                    name: helloasso
                    widget: boolean
                    default: false
                    required: false
                    hint: "Coché : le bouton ouvre le don (ou la page Nous soutenir tant que le lien HelloAsso n’est pas branché)."
          - label: "Venir nous voir"
            name: visit
            widget: object
            fields:
              - { label: "Sur-titre", name: kicker, widget: string }
              - { label: Titre, name: title, widget: string }
              - { label: "Texte du bouton", name: button_label, widget: string }
              - { label: "Lien du bouton", name: button_href, widget: string }
              - label: Coordonnées
                name: lines
                widget: list
                summary: "{{fields.text}}"
                fields:
                  - { label: Icône, name: icon, widget: string, hint: "Un symbole : ● ⌖ ☎ ✉ ◷" }
                  - { label: Texte, name: text, widget: text, hint: "Un retour à la ligne crée une nouvelle ligne à l’écran." }
                  - { label: "Lien (optionnel)", name: href, widget: string, required: false, hint: "Exemple : tel:+33631754145 ou mailto:gempv@laposte.net" }
                  - { label: "Première ligne en gras", name: strong_first, widget: boolean, default: false, required: false }
          - label: Carte
            name: map
            widget: object
            hint: "Laissez un lien vide pour garder la carte déjà en ligne."
            fields:
              - { label: "Lien Street View", name: street_url, widget: string, required: false }
              - { label: "Lien de la carte", name: map_url, widget: string, required: false }
              - { label: "Lien Google Maps", name: external_url, widget: string, required: false }
              - { label: "Texte du lien Google Maps", name: external_label, widget: string, required: false }
              - { label: "Titre de la carte (accessibilité)", name: iframe_title, widget: string, required: false }
              - { label: "Légende en gras", name: caption_strong, widget: string }
              - { label: "Suite de la légende", name: caption_rest, widget: string }
      - name: contact
        label: Contact
        file: content/pages/contact.md
        fields:
          - { label: "Titre de l’onglet du navigateur", name: title, widget: string }
          - { label: "Description (référencement)", name: description, widget: text }
          - label: En-tête
            name: hero
            widget: object
            fields:
              - { label: "Sur-titre", name: eyebrow, widget: string }
              - { label: "Titre avant l’italique", name: title_before, widget: string }
              - { label: "Titre en italique", name: title_em, widget: string }
              - { label: Chapô, name: lead, widget: text }
          - label: Formulaire
            name: form
            widget: object
            hint: "Les champs envoyés (nom, prénom, e-mail, message) restent ceux du formulaire. Seuls les libellés se modifient ici."
            fields:
              - { label: Titre, name: title, widget: string }
              - { label: Introduction, name: intro, widget: text }
              - { label: "Libellé Nom", name: label_nom, widget: string }
              - { label: "Libellé Prénom", name: label_prenom, widget: string }
              - { label: "Libellé E-mail", name: label_email, widget: string }
              - { label: "Libellé Téléphone", name: label_tel, widget: string }
              - { label: "Libellé Sujet", name: label_sujet, widget: string }
              - { label: "Libellé Message", name: label_message, widget: string }
              - { label: "Case de consentement", name: consent, widget: text }
              - { label: "Bouton d’envoi", name: submit, widget: string }
              - { label: "Mention avant l’adresse", name: hint_before, widget: string }
              - { label: "Adresse affichée sous le formulaire", name: hint_email, widget: string }
          - label: "Informations pratiques"
            name: practical
            widget: object
            fields:
              - { label: Titre, name: title, widget: string }
              - label: Coordonnées
                name: lines
                widget: list
                summary: "{{fields.text}}"
                fields:
                  - { label: Icône, name: icon, widget: string, hint: "Un symbole : ● ⌖ ☎ ✉ ◷" }
                  - { label: Texte, name: text, widget: text, hint: "Un retour à la ligne crée une nouvelle ligne à l’écran." }
                  - { label: "Lien (optionnel)", name: href, widget: string, required: false, hint: "Exemple : tel:+33631754145 ou mailto:gempv@laposte.net" }
                  - { label: "Première ligne en gras", name: strong_first, widget: boolean, default: false, required: false }
          - label: Localisation
            name: location
            widget: object
            fields:
              - { label: "Sur-titre", name: kicker, widget: string }
              - { label: Titre, name: title, widget: string }
              - { label: Chapô, name: lead, widget: text }
              - label: Encadrés
                name: cards
                widget: list
                label_singular: Encadré
                summary: "{{fields.title}}"
                fields:
                  - { label: Titre, name: title, widget: string }
                  - { label: Texte, name: text, widget: text }
          - label: Carte
            name: map
            widget: object
            hint: "Laissez un lien vide pour garder la carte déjà en ligne. Street View est affiché en premier."
            fields:
              - { label: "Lien Street View", name: street_url, widget: string, required: false }
              - { label: "Lien de la carte", name: map_url, widget: string, required: false }
              - { label: "Lien Google Maps", name: external_url, widget: string, required: false }
              - { label: "Texte du lien Google Maps", name: external_label, widget: string, required: false }
              - { label: "Titre de la carte (accessibilité)", name: iframe_title, widget: string, required: false }
              - { label: "Légende en gras", name: caption_strong, widget: string }
              - { label: "Suite de la légende", name: caption_rest, widget: string }
          - label: "Questions fréquentes"
            name: faq
            widget: object
            fields:
              - { label: "Sur-titre", name: kicker, widget: string }
              - { label: Titre, name: title, widget: string }
              - label: Questions
                name: items
                widget: list
                label_singular: Question
                summary: "{{fields.question}}"
                fields:
                  - { label: Question, name: question, widget: string }
                  - { label: Réponse, name: answer, widget: text }
          - label: "Appel à l’action"
            name: cta
            widget: object
            fields:
              - { label: Titre, name: title, widget: string }
              - { label: Texte, name: lead, widget: text }
              - { label: "Texte du premier bouton", name: primary_label, widget: string }
              - { label: "Lien du premier bouton", name: primary_href, widget: string }
              - label: "Style du premier bouton"
                name: primary_style
                widget: select
                options:
                  - { label: Plein, value: primary }
                  - { label: Contour, value: outline }
                  - { label: Discret, value: ghost }
                  - { label: Soleil, value: sun }
                default: sun
              - { label: "Texte du second bouton", name: secondary_label, widget: string }
              - { label: "Lien du second bouton", name: secondary_href, widget: string }
              - label: "Style du second bouton"
                name: secondary_style
                widget: select
                options:
                  - { label: Plein, value: primary }
                  - { label: Contour, value: outline }
                  - { label: Discret, value: ghost }
                  - { label: Soleil, value: sun }
                default: ghost
